server:
  port: 8082

spring:
  application:
    name: example-spring-boot2
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# CSAP API Doc 配置
# 扫描包和存储策略由启动类上的 @EnableApidoc 指定,不在这里配置
csap:
  apidoc:
    api-info:
      title: CSAP API Doc - Spring Boot 2.x Example
      version: 1.0.0
      description: 基于 Spring Boot 2.7.x (javax.servlet) 的 API 文档示例
    devtool:
      enabled: true   # 仅开发环境开启
      cache: true
  # 运行时请求参数校验(1.2.0 起):off(默认)/ observe(记录并放行)/ enforce(拦截)
  # validation:
  #   mode: observe
  #   http-status: 200          # 校验失败的 HTTP 状态码,响应体始终是 {code, message}
  #   endpoints:                # 按接口覆盖,键为 Controller 全限定类名.方法名
  #     "[ai.csap.example.controller.UserController.createUser]": enforce

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

# Logging
logging:
  level:
    root: INFO
    ai.csap.apidoc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
