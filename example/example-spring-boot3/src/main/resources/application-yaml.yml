# YAML 策略配合使用的配置样例,启用:--spring.profiles.active=yaml
# 注意:profile 不会切换存储策略,策略只由启动类上的 @EnableApidoc(paramType = ...) 决定,见 STRATEGIES.md。
# 端口沿用 application.yml 的 8083。

spring:
  application:
    name: csap-apidoc-example-yaml

# CSAP API Doc Configuration
csap:
  apidoc:
    devtool:
      enabled: true
      cache: true

# Logging
logging:
  level:
    ai.csap.apidoc: DEBUG
    root: INFO

# Note:
# YAML strategy is configured in @EnableApidoc annotation
# The path is specified directly in the annotation, not here

