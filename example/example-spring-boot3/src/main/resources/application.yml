server:
  port: 8083

spring:
  application:
    name: example-spring-boot3
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# CSAP API Doc 配置
csap:
  apidoc:
    devtool:
      enabled: true
      cache: true
    # ─────────────────────────────────────────────────────────────────────
    # 内嵌 MCP 端点(1.3.0 起,默认关闭):AI 客户端通过 POST /csap/mcp 调用文档里的接口。
    # 打开后在 /devtools-ui/mcp 管理暴露范围(默认只暴露 GET)和查看审计日志。
    # 令牌请放在环境变量里;见 https://apidoc.csap.ai/guide/mcp
    # ─────────────────────────────────────────────────────────────────────
    # mcp:
    #   enabled: true
    #   auth:
    #     mode: token
    #     tokens:
    #       - name: my-ide
    #         value: ${CSAP_MCP_TOKEN:}
    # ─────────────────────────────────────────────────────────────────────
    # OPTIONAL: csap-apidoc-devtools reverse-proxy endpoint (CORS bypass).
    #
    # Default OFF. Uncomment to enable POST /csap/apidoc/devtools/proxy so
    # the standalone csap-apidoc-ui can issue Try-it-out calls without
    # tripping over browser CORS. STRICT allowlist required. Read
    # csap-apidoc-devtools/PROXY.md before enabling on any non-local host
    # (this endpoint is an SSRF primitive — pair with Spring Security in
    # production).
    # ─────────────────────────────────────────────────────────────────────
    # devtools:
    #   proxy:
    #     enabled: true
    #     allowed-hosts:
    #       - localhost
    #       - 127.0.0.1
    #       # - api.staging.example.com
    #       # - "*.staging.example.com"
    #     max-body-bytes: 5242880
    #     timeout-ms: 30000
    #     strip-headers:
    #       - Cookie
    #       - X-Forwarded-For
    #       - X-Real-IP
    #     log-bodies: false
  # 运行时请求参数校验(1.2.0 起):off(默认)/ observe(记录并放行)/ enforce(拦截)
  # 1.1.x 的 enabled: true 仍然有效,等同 mode: enforce
  validation:
    mode: enforce
    # http-status: 200          # 校验失败的 HTTP 状态码,响应体始终是 {code, message}
    # endpoints:                # 按接口覆盖,键为 Controller 全限定类名.方法名
    #   "[ai.csap.example.controller.ProductController.updateStock]": observe

  # ─────────────────────────────────────────────────────────────────────
  # Demo Security (JWT, in-memory users)
  #
  # Default OFF — when off, every endpoint is public, exactly as before.
  # Switch on to demo the "configure a Bearer token in csap-apidoc-ui →
  # Try it out → 200" flow. See SECURITY.md.
  #
  # Public endpoints when enabled (no token required):
  #   /csap/apidoc/**, /csap/openapi.json, /csap/openapi/**, /csap-api.html,
  #   DevTools (/csap-api-devtools.html, /devtools-ui/**, /devtools/**, /csap/yaml/**),
  #   /csap/mcp (MCP checks its own token), /auth/**, /actuator/health,
  #   /error, static assets. Full list: SecurityConfig.PUBLIC_PATHS
  # Everything else (notably /api/users, /api/products) requires a JWT.
  # ─────────────────────────────────────────────────────────────────────
  example:
    security:
      enabled: false
      jwt-secret: "csap-apidoc-demo-jwt-secret-please-override-in-production-32b+"
      jwt-expiration-minutes: 60
      issuer: "csap-apidoc-example"
      # Optional explicit user list. Omit / leave empty to fall back to the
      # built-in admin/admin123 + user/user123 demo pair.
      # users:
      #   - username: alice
      #     password: alice-pw
      #     roles: [ADMIN]
      #   - username: bob
      #     password: bob-pw
      #     roles: [USER]

# Management Endpoints (Spring Boot 3.x 改进的 Actuator)
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true
  # Spring Boot 3.x 新增的 Observability 配置
  metrics:
    export:
      prometheus:
        enabled: false
  tracing:
    sampling:
      probability: 1.0

# Logging
logging:
  level:
    root: INFO
    ai.csap.apidoc: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 与团队版对接(1.5.0 起,默认关闭;需要时取消注释)
# csap:
#   apidoc:
#     team:
#       enabled: true
#       url: http://team.example.com:8090
#       token: ${CSAP_TEAM_TOKEN}        # 团队版控制台创建的 REGISTER 令牌
#       service: example-service          # 省略时依次取 csap.apidoc.database.service、spring.application.name
#       # base-url: http://10.0.0.5:8080  # 省略时自动推断;容器 / 网关后面时请显式配置
#     mcp:
#       audit:
#         store: database                 # MCP 审计写入数据库模式的库(需要 paramType = DATABASE)
