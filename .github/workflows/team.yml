name: Team edition (csap-apidoc-team)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'csap-apidoc-team/**'
      - '.github/workflows/team.yml'
  pull_request:
    paths:
      - 'csap-apidoc-team/**'
      - '.github/workflows/team.yml'

permissions:
  contents: read

concurrency:
  group: team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csap-apidoc-team/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: csap-apidoc-team/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: server (mvn verify, MySQL/PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csap-apidoc-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: '**/pom.xml'
      # 团队版依赖同仓库的 csap-apidoc-database(版本 = 根 pom 版本),先从源码装到本地仓库,
      # 这样未发布到 Maven Central 的版本也能构建
      - name: Install csap-apidoc-database from source
        working-directory: .
        run: mvn -B -q install -DskipTests -Dcheckstyle.skip -pl csap-apidoc-strategy/csap-apidoc-database -am
      - run: mvn -B verify
