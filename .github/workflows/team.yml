name: Team edition (csap-apidoc-team)

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'csap-apidoc-team/**'
      - '.github/workflows/team.yml'
  pull_request:
    paths:
      - 'csap-apidoc-team/**'
      - '.github/workflows/team.yml'

permissions:
  contents: read

concurrency:
  group: team-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csap-apidoc-team/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: csap-apidoc-team/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  server:
    name: server (mvn verify, MySQL/PostgreSQL via Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: csap-apidoc-team
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: csap-apidoc-team/**/pom.xml
      - run: mvn -B verify
